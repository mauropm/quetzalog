# Built-in MITRE event→technique mapping rules.
#
# Rules are pure functions (event) → {tactic, technique, confidence}; a
# single event may match multiple rules (multi-technique). All conditions
# in `when` are ANDed; unset conditions are wildcards. message_regex and
# match patterns are case-insensitive. `source_type` matches both the
# transport source type and the normalized source_class attribute.
#
# Techniques and tactics must exist in the embedded catalog
# (mitre.go); unknown IDs fail startup.
---
- id: ps1-encoded-command
  when:
    process: powershell
    message_regex: (-enc(odedcommand)?\b|frombase64string|invoke-expression\s+invoke)
  tactic: TA0002
  technique: T1059.001
  confidence: 0.9
  description: PowerShell with encoded or base64 command execution

- id: ps1-web-request
  when:
    process: powershell
    message_regex: (invoke-webrequest|invoke-restmethod|downloadstring|downloadfile|\biwr\b|\bwc\.|\bcurl\b.*http)
  tactic: TA0010
  technique: T1105
  confidence: 0.7
  description: PowerShell fetching remote content (download cradle)

- id: wmic-process-create
  when:
    process: wmic
    message_regex: process\s+call\s+create
  tactic: TA0002
  technique: T1059.001
  confidence: 0.8
  description: wmic process call create (defense evasion via signed binary)

- id: regsvr32-proxy
  when:
    process: regsvr32
    message_regex: (/scrobj|/i:.*\.dll|/s,/u|http)
  tactic: TA0002
  technique: T1218.010
  confidence: 0.75
  description: regsvr32 signed-binary proxy execution

- id: rundll32-proxy
  when:
    process: rundll32
    message_regex: (javascript:|vbscript:|http|\.dll\s+)
  tactic: TA0002
  technique: T1218.011
  confidence: 0.75
  description: rundll32 signed-binary proxy execution

- id: certutil-download
  when:
    process: certutil
    message_regex: (-urlcache|-verifyctl.*-f.*http|-\s*url\s+http)
  tactic: TA0010
  technique: T1105
  confidence: 0.8
  description: certutil used to download remote content

