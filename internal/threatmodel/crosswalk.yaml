# Framework crosswalk catalogs (threat-model.md §1). Embedded data, same
# pattern as internal/mitre rules. A threat may carry STRIDE + technique +
# kill-chain + D3FEND simultaneously — the point is multi-framework, not
# forcing one model into one framework.

