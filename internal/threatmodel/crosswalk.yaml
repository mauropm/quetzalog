# Control catalog: embedded compliance control definitions used to map
# threats → controls (threat-controls with mapping_state).
controls:
  - control_id: ctl_mfa
    framework: d3fend
    ref: DF_43
    name: Multi-Factor Authentication
    description: Require a second authentication factor for privileged and remote access.
  - control_id: ctl_password
    framework: d3fend
    ref: DF_48
    name: Password Protection
    description: Enforce strong password policies and storage.
  - control_id: ctl_lockout
    framework: d3fend
    ref: DF_53
    name: Account Lockout
    description: Temporarily lock accounts after repeated authentication failures.
  - control_id: ctl_access_control
    framework: d3fend
    ref: DF_02
    name: Access Control
    description: Restrict object access to authorized identities.
  - control_id: ctl_least_privilege
    framework: d3fend
    ref: DF_13
    name: Least Privilege
    description: Grant only the minimum privileges required.
  - control_id: ctl_app_filtering
    framework: d3fend
    ref: DF_14
    name: Application Filtering
    description: Block or restrict unapproved executable content.
  - control_id: ctl_waf
    framework: d3fend
    ref: DF_22
    name: Web Application Firewall
    description: Filter web requests for known attack patterns.
  - control_id: ctl_net_filtering
    framework: d3fend
    ref: DF_31
    name: Network Traffic Filtering
    description: Filter network traffic at the boundary.
  - control_id: ctl_net_anomaly
    framework: d3fend
    ref: DF_98
    name: Network Anomaly Detection
    description: Detect anomalous network behavior (beaconing, scanning).
  - control_id: ctl_logging
    framework: d3fend
    ref: DF_54
    name: Logging
    description: Record security-relevant events for review and audit.
  - control_id: ctl_backup
    framework: d3fend
    ref: DF_64
    name: Backup
    description: Maintain recoverable copies of critical data.
  - control_id: ctl_anti_tamper
    framework: d3fend
    ref: DF_94
    name: Anti-tampering
    description: Protect integrity of logs, configs, and binaries.
  - control_id: ctl_code_signing
    framework: d3fend
    ref: DF_40
    name: Code Signing Enforcement
    description: Execute only signed, trusted code.
  - control_id: ctl_email_filtering
    framework: d3fend
    ref: DF_49
    name: Email Filtering
    description: Screen inbound mail for malicious content.
  - control_id: ctl_rate_limit
    framework: d3fend
    ref: DF_04
    name: Rate Limiting
    description: Cap request rates to blunt DoS and brute force.
  - control_id: ctl_file_isolation
    framework: d3fend
    ref: DF_74
    name: File System Isolation
    description: Isolate sensitive data from general-access storage.
  - control_id: ctl_file_monitoring
    framework: d3fend
    ref: DF_85
    name: File Monitoring
    description: Monitor file access and modification for anomalies.
  - control_id: ctl_net_encryption
    framework: d3fend
    ref: DF_66
    name: Network Traffic Encryption
    description: Encrypt data in transit to the network.
