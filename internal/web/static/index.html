<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Quetzalog — modern, developer-friendly security platform. See more. Solve faster.">
<title>Quetzalog — Small Dragon. Big Insights.</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/layout.css">
</head>
<body>
<a class="ql-sr" href="#view">Skip to content</a>

<!-- ── Login ─────────────────────────────────────────────── -->
<div id="login-screen" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-dragon" id="login-dragon" aria-hidden="true"></div>
    <h1 class="login-title"><span class="q">Q</span>uetzalog</h1>
    <div class="login-tagline">See more. Solve faster.</div>
    <div class="login-personality">Small Dragon. Big Insights.</div>
    <form class="login-box" id="login-form" novalidate>
      <div class="field">
        <label for="login-user">Username</label>
        <input class="input" id="login-user" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input class="input" id="login-pass" name="password" type="password" autocomplete="current-password" required>
        <div class="field-hint" id="login-hint"></div>
      </div>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      <div class="field-hint" id="login-error" role="alert" aria-live="polite"></div>
    </form>
    <div class="login-foot" id="login-foot"></div>
  </div>
</div>

<!-- ── App shell ─────────────────────────────────────────── -->
<div id="app-shell" hidden>
  <aside class="sidebar" aria-label="Primary navigation">
    <div id="brand-slot"></div>
    <nav class="nav-section" id="main-nav" aria-label="Main">
      <div class="nav-group-label">Monitor</div>
      <a class="nav-item" data-route="overview" href="#/overview">
        <span class="ic-wrap" data-icon="dashboard"></span><span>Overview</span>
      </a>
      <a class="nav-item" data-route="queue" href="#/queue">
        <span class="ic-wrap" data-icon="queue"></span><span>Analyst Queue</span>
        <span class="nav-badge" id="nav-queue-badge" hidden></span>
      </a>
      <a class="nav-item" data-route="investigations" href="#/investigations">
        <span class="ic-wrap" data-icon="investigate"></span><span>Investigations</span>
      </a>

      <div class="nav-group-label">Analyze</div>
      <a class="nav-item" data-route="search" href="#/search">
        <span class="ic-wrap" data-icon="search"></span><span>Search</span>
      </a>
      <a class="nav-item" data-route="builder" href="#/builder">
        <span class="ic-wrap" data-icon="blocks"></span><span>SPL Builder</span>
      </a>

      <div class="nav-group-label">Investigate</div>
      <a class="nav-item" data-route="detections" href="#/detections">
        <span class="ic-wrap" data-icon="shieldAlert"></span><span>Detections</span>
      </a>
      <a class="nav-item" data-route="risk" href="#/risk">
        <span class="ic-wrap" data-icon="gauge"></span><span>Risk</span>
      </a>
      <a class="nav-item" data-route="entities" href="#/entities">
        <span class="ic-wrap" data-icon="entities"></span><span>Entities</span>
      </a>
      <a class="nav-item" data-route="mitre" href="#/mitre">
        <span class="ic-wrap" data-icon="crosshair"></span><span>Threat Intelligence</span>
      </a>
      <a class="nav-item" data-route="aianalyst" href="#/aianalyst">
        <span class="ic-wrap" data-icon="spark"></span><span>AI Analyst</span>
      </a>

      <div class="nav-group-label">System</div>
      <a class="nav-item" data-route="settings" href="#/settings">
        <span class="ic-wrap" data-icon="settings"></span><span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer" id="sidebar-user"></div>
  </aside>

  <div class="nav-scrim" id="nav-scrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Open navigation">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search-box" id="global-search">
        <span class="ic-lead" data-icon="search"></span>
        <button class="input" id="global-search-btn" style="cursor:pointer;text-align:left;font:400 13px var(--ql-font);color:var(--ql-text-muted);width:100%;" aria-haspopup="dialog">
          Search logs, hosts, users, IPs…
        </button>
        <span class="kbd" aria-hidden="true"><span id="kbd-mod">⌘</span><span>K</span></span>
      </div>
      <div class="topbar-actions">
        <div style="position:relative">
          <button class="icon-btn" id="notif-btn" aria-label="Notifications" data-tip="Notifications">
            <span data-icon="bell"></span>
            <span class="bell-count" id="notif-count" hidden></span>
          </button>
          <div class="menu notif-menu" id="notif-menu" hidden></div>
        </div>
        <button class="icon-btn" id="help-btn" aria-label="Help" data-tip="Help">
          <span data-icon="help"></span>
        </button>
        <div style="position:relative">
          <button class="user-chip" id="user-chip" aria-haspopup="menu" aria-label="Account menu">
            <span class="avatar" id="user-avatar"></span>
            <span class="user-meta">
              <span class="user-name" id="user-name"></span><br>
              <span class="user-role" id="user-role"></span>
            </span>
            <span data-icon="chevron-down"></span>
          </button>
          <div class="menu" id="user-menu" hidden></div>
        </div>
      </div>
    </header>

    <main class="view" id="view">
      <div class="view-inner" id="page"></div>
    </main>
  </div>
</div>

<div class="toast-region" aria-live="polite"></div>

<script src="/static/js/icons.js"></script>
<script src="/static/js/dragon.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/pages-main.js"></script>
<script src="/static/js/pages-extra.js"></script>
</body>
</html>
