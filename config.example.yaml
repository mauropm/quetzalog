server:
  host: "127.0.0.1"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"

database:
  path: "./data/siem.db"
  max_open_conns: 25
  max_idle_conns: 5
  max_idle_time: "300s"

ingestion:
  workers: 4
  batch_size: 500
  max_message_size: "10mb"

http:
  enabled: true
  token: ""

otel:
  enabled: true
  grpc_port: 4317
  http_port: 4318

syslog:
  udp_enabled: true
  udp_port: 5514
  tcp_enabled: true
  tcp_port: 5514

splunk:
  hec_enabled: true
  hec_port: 8088
  hec_tokens:
      # Generate your own strong random token, e.g.:
      #   openssl rand -hex 32
      # HEC tokens are ingest-only: they may POST events, never manage the API.
    - id: local
      token: REPLACE_ME_with_random_secret

logging:
  level: "info"

detections:
  # When true, enabled detection rules run on the interval and materialize
  # findings (and risk contributions) automatically. Off by default so a
  # single SIEM process stays the unit of deployment; no external scheduler.
  scheduled: false
  interval: "5m"

auth:
  # When true (default) every management endpoint requires a bearer token:
  #   - auth.api_token: static operator token (or env QUETZALOG_API_TOKEN)
  #   - per-user tokens from POST /api/v1/login (roles enforced)
  # Set false ONLY for trusted single-container/local development use.
  enabled: true
  local_auth_enabled: true
  # Leave empty to use per-user login tokens; or export QUETZALOG_API_TOKEN
  # / set a strong random value generated with: openssl rand -hex 32
  api_token: ""

file_ingestion:
  sources:
    - name: system-logs
      path: "/var/log/syslog"
      format: "syslog"
    - name: auth-logs
      path: "/var/log/auth.log"
      format: "syslog"
    - name: application-json
      path: "./logs/application.json"
      format: "json"
